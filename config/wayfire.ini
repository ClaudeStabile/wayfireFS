# =============================================================================
# Wayfire Configuration - Cleaned & Optimized
# =============================================================================

[input]
xkb_layout = ch
xkb_variant = fr
cursor_size = 48

[output:eDP-1]
mode = 3840x2160@60000
position = 0,0
transform = normal
scale = 2.000000

# -----------------------------------------------------------------------------
# CORE & PLUGINS
# -----------------------------------------------------------------------------

[core]
plugins = \
  alpha \
  animate \
  annotate \
  autostart \
  command \
  cube \
  decoration \
  expo \
  extra-animations \
  fast-switcher \
  fisheye \
  foreign-toplevel \
  grid \
  gtk-shell \
  idle \
  invert \
  ipc \
  ipc-rules \
  mag \
  move \
  oswitch \
  place \
  resize \
  scale \
  session-lock \
  shortcuts-inhibit \
  showrepaint \
  switcher \
  vswitch \
  water \
  wayfire-shell \
  window-rules \
  wm-actions \
  wobbly \
  workspaces \
  workspace-names \
  wrot \
  zoom

vwidth = 4
vheight = 1
preferred_decoration_mode = client
close_top_view = <alt> KEY_F4

# -----------------------------------------------------------------------------
# AUTOSTART
# -----------------------------------------------------------------------------

[autostart]
wallpaper = swaybg -i /home/claude/LookAndFeel_2.0/green_spider-wayfire.png -m fill
#wallpaper = swaybg -i /home/claude/LookAndFeel_2.0/green_spider.png -m fill
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY
clipboard = wl-clip-persist --clipboard regular
outputs = kanshi
notifications = mako
gamma = wlsunset
idle = swayidle before-sleep swaylock
portal = /usr/libexec/xdg-desktop-portal

# Disable internal shell autostart to avoid duplicate launches
autostart_wf_shell = false
#autostart_wf_shell = true 
# Run binaries directly without shell wrapper strings
dock = /usr/local/bin/wf-dock
panel = /usr/local/bin/wf-panel
#dock = sh -c 'sleep 2 && /usr/local/bin/wf-dock'
#panel = sh -c 'sleep 1 && /usr/local/bin/wf-panel'

# -----------------------------------------------------------------------------
# NAVIGATION & WINDOW MANAGEMENT
# -----------------------------------------------------------------------------

[move]
activate = <alt> BTN_LEFT
enable_snap = 1
enable_snap_off = 1

[resize]
activate = <alt> BTN_RIGHT

[place]
mode = cascade

[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_always_on_top = <super> KEY_X
toggle_sticky = <shift> <super> KEY_X

[grid]
slot_bl = <ctrl> <alt> KEY_KP1
slot_b  = <ctrl> <alt> KEY_KP2
slot_br = <ctrl> <alt> KEY_KP3
slot_l  = <ctrl> <alt> KEY_KP4 | <ctrl> <super> KEY_LEFT
slot_c  = <ctrl> <alt> KEY_KP5 | <ctrl> <super> KEY_UP
slot_r  = <ctrl> <alt> KEY_KP6 | <ctrl> <super> KEY_RIGHT
slot_tl = <ctrl> <alt> KEY_KP7
slot_t  = <ctrl> <alt> KEY_KP8
slot_tr = <ctrl> <alt> KEY_KP9
restore = <ctrl> <super> KEY_DOWN | <super> KEY_KP0

[vswitch]
binding_down = <ctrl> <alt> KEY_DOWN
binding_up = <ctrl> <alt> KEY_UP
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_down = <ctrl> <super> <shift> KEY_DOWN
with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_right = <ctrl> <super> <shift> KEY_RIGHT

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[fast-switcher]
activate = <alt> KEY_ESC

[oswitch]
next_output = <super> KEY_O
next_output_with_win = <super> <shift> KEY_O

# -----------------------------------------------------------------------------
# EFFECTS & ANIMATIONS
# -----------------------------------------------------------------------------

[cube]
activate = <ctrl> <alt> BTN_LEFT
rotate_left = <ctrl> <alt> KEY_LEFT
rotate_right = <ctrl> <alt> KEY_RIGHT
deform = 0
zoom = 0.10
duration = 850
speed_zoom = 0.070
speed_spin_horiz = 0.020
speed_spin_vert = 0.020
light = true
background_mode = skydome
skydome_texture = /home/kubuntu/LookAndFeel_2.0/CubeBackground.png
skydome_mirror = true

[expo]
toggle = <super> KEY_S
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4

[scale]
toggle = <super> KEY_W
toggle_all = <shift> <super> KEY_W
spacing = 20
duration = 300
inactive_alpha = 1.0
middle_click_close = true

[wobbly]
spring_k = 8
friction = 3
grid_resolution = 6

[animate]
duration = 180
startup_duration = 300
open_animation = zoom
close_animation = zoom
fade_enabled_for = none

[alpha]
modifier = <super> <alt>
min_value = 0.01

[zoom]
modifier = <super>
speed = 0.010
smoothing_duration = 300

[mag]
toggle = <super> KEY_M
zoom_level = 75
default_height = 500

[fisheye]
toggle = <super> <ctrl> KEY_F

[invert]
toggle = <super> KEY_N

[wrot]
activate = <super> <ctrl> BTN_RIGHT

[water]
activate = F10

[showrepaint]
toggle = <alt> <super> KEY_R

[annotate]
draw = <ctrl> <alt> BTN_LEFT
clear_workspace = <ctrl> <alt> KEY_C

# -----------------------------------------------------------------------------
# UI & UTILITIES
# -----------------------------------------------------------------------------

[decoration]
border_size = 1

[idle]
screensaver_timeout = 300
dpms_timeout = 600

[workspace-names]
display_duration = 1500
text_color = 1.0 1.0 1.0 1.0
background_color = 0.0 0.0 0.0 0.6
font = sans-serif
position = top_center

[wayfire-shell]
toggle_menu = <super>

[window-rules]
cairo_nodecor = on created if app_id contains "cairo-dock" then set_decoration false
cairo_sticky = on created if app_id contains "cairo-dock" then stick
# -----------------------------------------------------------------------------
# KEYBINDINGS & COMMANDS
# -----------------------------------------------------------------------------

[command]
# Applications
binding_terminal = <ctrl> <alt> KEY_T
command_terminal = gnome-terminal

binding_launcher = <super> <shift> KEY_ENTER
command_launcher = wofi

binding_lock = <super> <shift> KEY_ESC
command_lock = swaylock

binding_logout = <super> KEY_ESC
command_logout = wlogout

# Screenshots
binding_screenshot = <ctrl> <alt> KEY_R 
command_screenshot = sh -c 'mkdir -p "$HOME/Pictures"; grim "$HOME/Pictures/Screenshot-$(date +%F_%H-%M-%S).png"'

binding_screenshot_interactive = <ctrl> <super> <alt> KEY_R 
command_screenshot_interactive = sh -c 'mkdir -p "$HOME/Pictures"; grim -g "$(slurp)" "$HOME/Pictures/Screenshot-$(date +%F_%H-%M-%S).png"'

binding_window_screenshot = <alt> KEY_R 
command_window_screenshot = sh -c 'mkdir -p "$HOME/Pictures"; grim -g "$(slurp)" "$HOME/Pictures/Window-$(date +%F_%H-%M-%S).png"'

# Volume control (PulseAudio / PipeWire)
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = pactl set-sink-volume @DEFAULT_SINK@ +5%

repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = pactl set-sink-volume @DEFAULT_SINK@ -5%

binding_mute = KEY_MUTE
command_mute = pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness control
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = brightnessctl set +5%

repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = brightnessctl set 5%-
